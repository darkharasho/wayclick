[package]
name = "libei-spike"
version = "0.1.0"
edition = "2021"
publish = false

# Spike only: prove a libei connection via the RemoteDesktop portal can (1) hold
# a mouse button reliably, (2) report whether KDE's EIS offers an ABSOLUTE
# pointer, and (3) return a restore token for one-time consent. Not product code.

[dependencies]
reis = "0.7"
ashpd = { version = "0.13.3", default-features = false, features = ["tokio", "remote_desktop", "screencast"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "time"] }
calloop = "0.14"
enumflags2 = "0.7"
once_cell = "1"

[[bin]]
name = "libei-spike"
path = "src/main.rs"
